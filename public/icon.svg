<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Tactical Rounded Shield Base -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Tactical Radar Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-dasharray="2 3" stroke-width="1" />

  <!-- Stylized Sentinel 'S' Monogram -->
  <path d="M42 19 H26 C22 19 19 22 19 25.5 C19 29 22 31.5 26 31.5 H38 C42 31.5 45 34 45 37.5 C45 41 42 45 38 45 H22" 
        fill="none" 
        stroke="url(#amberGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Strategic Radar Eye Dot -->
  <circle cx="32" cy="32" r="2.75" fill="#FEF3C7" />
</svg>
